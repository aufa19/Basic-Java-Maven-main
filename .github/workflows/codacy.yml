name: Codacy Scan

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  codacy:
    name: Analyze with Codacy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install Codacy CLI
        run: |
          curl -L https://app.codacy.com/assets/downloads/cli/install.sh  | sh
          export PATH="$HOME/.codacy/bin:$PATH"

      - name: Run Codacy Scan
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: codacy coverage --report-dir=coverage-report
